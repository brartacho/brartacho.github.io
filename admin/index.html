<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin — ARTACHO.dev</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../imagens/favicon-artacho.svg">
    <link rel="manifest" href="/admin/manifest.webmanifest">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="apple-touch-icon" href="/admin/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Admin">
    <link rel="stylesheet" href="/admin/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/admin/assets/fontawesome/css/all.min.css">
    <script src="/admin/assets/js/sortable.min.js"></script>
    <script src="/admin/assets/js/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     LOGIN
═══════════════════════════════════════════════════════ -->
<div id="loginScreen">
    <div class="login-card">
        <p class="login-brand">ARTACHO<span>.</span>dev</p>
        <p class="login-label">// painel administrativo</p>

        <!-- Honeypot: invisível pra humanos, bots preenchem. Não remova. -->
        <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none;">
            <label>Não preencha este campo
                <input type="text" id="loginWebsite" name="website" tabindex="-1" autocomplete="off">
            </label>
        </div>

        <div class="form-group">
            <label for="loginUsername">Email</label>
            <input type="email" id="loginUsername" placeholder="seu@email.com" autocomplete="username" inputmode="email">
        </div>
        <div class="form-group">
            <label for="loginPassword">Senha</label>
            <div class="pw-wrap">
                <input type="password" id="loginPassword" placeholder="Digite sua senha" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
                <button type="button" class="pw-toggle" id="pwToggleBtn" aria-label="Mostrar senha" onclick="togglePassword()">
                    <i class="fa-regular fa-eye" id="pwToggleIcon"></i>
                </button>
            </div>
        </div>
        <button class="btn btn-cyan" id="loginBtn" style="width:100%" onclick="doLogin()">
            <i class="fa-solid fa-unlock-keyhole"></i> Entrar
        </button>
        <p id="loginError" style="color:var(--danger);font-size:0.85rem;margin-top:12px;display:none;"></p>
        <button type="button" class="forgot-link" onclick="openForgot()">
            Esqueci minha senha
        </button>
    </div>

    <div id="forgotModal" class="forgot-modal" hidden>
        <div class="forgot-card">
            <button class="forgot-close" onclick="closeForgot()" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="forgot-title">Recuperar acesso</h3>
            <p class="forgot-desc" id="forgotDesc">
                Vou enviar um link de recuperação para o email cadastrado do administrador. O link expira em 1 hora.
            </p>
            <button class="btn btn-cyan" id="forgotBtn" style="width:100%" onclick="sendRecovery()">
                <i class="fa-solid fa-paper-plane"></i> Enviar link de recuperação
            </button>
            <p id="forgotMessage" class="forgot-msg" hidden></p>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     APP
═══════════════════════════════════════════════════════ -->
<div id="adminShellMount" style="display:contents"></div>
<script>
    window.ADMIN_CONFIG = window.ADMIN_CONFIG || { mode: "prod", apiBase: "/api/admin" };
</script>
<script>
// Carrega o app-shell compartilhado e o core, depois roda o bootstrap de produção.
(async () => {
    const mount = document.getElementById("adminShellMount");
    try {
        const html = await fetch("/admin/assets/admin-shell.html", { cache: "no-cache" }).then(r => r.text());
        mount.innerHTML = html;
    } catch (e) {
        mount.innerHTML = "<p style=\"padding:24px;color:#ef4444\">Falha ao carregar o painel. Recarregue a página.</p>";
        return;
    }
    await new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "/admin/assets/js/admin-core.js";
        s.onload = res; s.onerror = rej;
        document.body.appendChild(s);
    });
    // INIT (produção): probe de cookie de sessão httpOnly
    try {
        const r = await fetch("/api/admin/cv-versions", { credentials: "include" });
        if (r.ok) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("appScreen").style.display = "block";
            scheduleSessionRefresh();
            loadAll();
        } else {
            document.getElementById("loginScreen").style.display = "flex";
        }
    } catch {
        document.getElementById("loginScreen").style.display = "flex";
    }
})();
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker
                .register('/admin/service-worker.js', { scope: '/admin/' })
                .catch((err) => console.warn('SW register failed:', err));
        });
    }
</script>
</body>
</html>
